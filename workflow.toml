schema_version = 1
project = "gotth-pg-migrate"
profile = "strict"
active = "extraction"

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build ./..."
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/artifacts/global-coverage-map.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature.extraction]
id = "extraction"
slug = "extraction"
name = "Extract the admitted migration engine"
namespace = "migration"
parent = ""
state = "done"
risk = "high"
assurance = "traceable-tests"
created_at = "2026-09-02T23:01:33Z"
activated_at = "2026-09-02T23:01:33Z"
updated_at = "2026-09-02T23:18:00Z"
completed_at = "2026-09-02T23:18:00Z"
folder = "workflow/features/extraction"
worktree = "."
branch = "main"
scope = ["Extract immutable PostgreSQL migration mechanics from GOTTH Board"]
non_goals = ["Change GOTTH Board migration SQL or production database state"]
affected_files = ["**"]
invariants = ["Existing GOTTH Board ledger remains compatible"]
acceptance = ["All local unit, race, formatting, and vet gates pass", "PostgreSQL 17 integration suite retained for consumer validation"]

[feature.extraction.rollback]
strategy = "delete_unpublished_repository"
notes = "Before consumers pin a release, remove the new repository and retain in-tree code"
data_loss_risk = false
requires_migration_down = false

[[feature.extraction.verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 600
side_effect = "local_write"
network = false
retries = 0
